
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mango-rabbitmq-pvc
  namespace: mango
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mango-rabbitmq
  namespace: mango
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mango-rabbitmq
  template:
    metadata:
      labels:
        app: mango-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: mango-infrastructure-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: mango-infrastructure-secrets
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: mango-rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mango-rabbitmq
  namespace: mango
spec:
  type: ClusterIP
  selector:
    app: mango-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

apiVersion: v1
kind: ConfigMap
metadata:
  name: mango-common-config
  namespace: mango
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_HTTP_PORTS: "8080"

  ApiSettings__Issuer: "mango-auth-api"
  ApiSettings__Audience: "mango-client"

  TopicAndQueueNames__EmailShoppingCartQueue: "emailshoppingcart"
  TopicAndQueueNames__RegisterUserQueue: "emailregisteruser"